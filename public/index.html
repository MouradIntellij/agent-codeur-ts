<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codeur — agent IA de codage</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --user: #0ea5e9;
    --assistant: #1e293b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 860px; height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header .logo { font-size: 26px; }
  header h1 { font-size: 18px; }
  header .model { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  button {
    background: var(--accent); color: #082f49; border: none;
    padding: 8px 14px; border-radius: 8px; font-weight: 600;
    cursor: pointer; font-size: 13px;
  }
  button:hover { filter: brightness(1.1); }
  #messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 14px; white-space: pre-wrap; line-height: 1.5; }
  .msg.user { align-self: flex-end; background: var(--user); color: white; border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: var(--assistant); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; background: #7f1d1d; border: 1px solid #991b1b; }
  details.tools {
    align-self: flex-start; max-width: 95%;
    font-size: 12px; color: var(--muted);
    background: #0b1220; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px;
  }
  details.tools summary { cursor: pointer; user-select: none; }
  details.tools pre {
    margin-top: 6px; font-size: 11px; white-space: pre-wrap;
    max-height: 220px; overflow-y: auto; color: var(--text);
    font-family: ui-monospace, Consolas, monospace;
  }
  .typing { display: flex; gap: 5px; padding: 6px 2px; }
  .typing span {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-5px); opacity: 1; } }
  footer {
    display: flex; gap: 10px; padding: 14px 20px;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--border);
    border-radius: 10px; background: var(--bg); color: var(--text);
    padding: 12px; font-family: inherit; font-size: 14px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  #hint { text-align: center; font-size: 12px; color: var(--muted); padding: 6px 0 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="logo">🤖</span>
    <div>
      <h1>Codeur</h1>
      <div class="model">agent de codage local — __MODEL__</div>
    </div>
    <div class="spacer"></div>
    <button id="reset">Nouvelle session</button>
  </header>

  <div id="messages"></div>

  <div id="hint">L'agent peut lire, créer et exécuter du code dans son espace de travail.</div>
  <footer>
    <textarea id="input" rows="2" placeholder="Posez votre question au Codeur… (Entrée = envoyer, Maj+Entrée = nouvelle ligne)"></textarea>
    <button id="send">Envoyer</button>
  </footer>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const resetBtn = document.getElementById("reset");

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "msg agent";
    div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addTools(tools) {
    if (!tools || tools.length === 0) return;
    const details = document.createElement("details");
    details.className = "tools";
    const summary = document.createElement("summary");
    summary.textContent = "🔧 " + tools.map(t => t.name).join(", ");
    details.appendChild(summary);
    for (const t of tools) {
      const pre = document.createElement("pre");
      const args = Object.entries(t.arguments || {})
        .map(([k, v]) => k + "=" + JSON.stringify(v)).join(", ");
      pre.textContent = "[outil] " + t.name + "(" + args + ")\n" + (t.result || "");
      details.appendChild(pre);
    }
    messagesEl.appendChild(details);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function ask() {
    const message = inputEl.value.trim();
    if (!message) return;
    inputEl.value = "";
    addMessage("user", message);
    const typing = addTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });
      const data = await res.json();
      typing.remove();
      if (!res.ok) { addMessage("error", data.error || "Erreur serveur."); return; }
      addTools(data.tools);
      addMessage("agent", data.response);
    } catch (err) {
      typing.remove();
      addMessage("error", "Impossible de joindre le serveur : " + err);
    }
  }

  sendBtn.addEventListener("click", ask);
  resetBtn.addEventListener("click", async () => {
    await fetch("/api/reset", { method: "POST" });
    messagesEl.innerHTML = "";
    addMessage("agent", "Nouvelle session. Je vous écoute.");
  });
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
  });

  addMessage("agent", "Bonjour ! Je suis le Codeur, votre agent de codage local. " +
    "Demandez-moi de créer du code, d'expliquer des fichiers, de chercher des " +
    "mots dans un dossier, ou de résumer un document (Word, PDF, Excel, PowerPoint).");
  inputEl.focus();
</script>
</body>
</html>
